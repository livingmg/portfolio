<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students card</title>
    <link rel="stylesheet" href="/studentcard/style.css">
</head>
<body>
    <div class="card">
        <h1>Student Profile</h1>
        <p id="message">Welcome and enter your name</p>
        <input type="text" id="studentName" placeholder="Enter your name">
        <button id="greetButton">Say Hello</button>
        <button id="colourButton">Change background</button>
        <button id="resetButton">Reset</button>
    </div>

    <script src="/studentcard/script.js"></script>

</body>
</html>
